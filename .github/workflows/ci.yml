name: CI

on:
  pull_request:
    paths:
      - ".github/**"
      - "docs/**"
      - "apps/**"
      - "package.json"
      - "bun.lock"
      - ".agents/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "docs/**"
      - "apps/**"
      - "package.json"
      - "bun.lock"
      - ".agents/**"

jobs:
  monorepo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Workspace unit tests
        run: bun run test

      - name: Web static checks
        run: bun run check:web

      - name: CLI static checks
        run: bun run check:cli

      - name: MCP static checks
        run: bun run check:mcp

      - name: Install browser for fixture tests
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: CSV and OAuth browser regressions
        run: bun run test:e2e:web client-import.e2e.ts oauth-connect.e2e.ts
        env:
          # All HTTP is intercepted or served by local fixtures; no Next server or live secrets.
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001

      - name: Production workspace build
        run: bun run build
        env:
          # Build-time module initialization (database, auth config) only; no live credentials.
          APP_URL: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/nota_ci
          SESSION_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
