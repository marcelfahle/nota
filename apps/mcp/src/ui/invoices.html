<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nota · Invoice workspace</title>
<style>
:root{color-scheme:light dark;--paper:#fcfcfa;--ink:#19191b;--muted:#62626e;--line:#dedee3;--wash:#f1f1ef;--accent:#126d58;--danger:#b23434;font:14px/1.5 var(--font-sans,ui-sans-serif,system-ui,sans-serif)}
@media(prefers-color-scheme:dark){:root{--paper:#202023;--ink:#f2f2ed;--muted:#b1b1bb;--line:#44444c;--wash:#2d2d32;--accent:#94dec5;--danger:#ffa3a3}}
:root[data-theme=dark]{--paper:#202023;--ink:#f2f2ed;--muted:#b1b1bb;--line:#44444c;--wash:#2d2d32;--accent:#94dec5;--danger:#ffa3a3}
:root[data-theme=light]{--paper:#fcfcfa;--ink:#19191b;--muted:#62626e;--line:#dedee3;--wash:#f1f1ef;--accent:#126d58;--danger:#b23434}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink)}main{padding:24px;max-width:880px;margin:auto}button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px}button:hover{background:var(--wash)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.brand{font-weight:750;letter-spacing:-.04em;font-size:23px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin:0}.subtitle{font-size:12px;color:var(--muted)}h1{font-size:23px;letter-spacing:-.035em;line-height:1.2;margin:0}.heading{display:flex;align-items:start;justify-content:space-between;gap:12px;margin:24px 0 16px}.amount{font-size:clamp(28px,6vw,42px);letter-spacing:-.045em;line-height:1.2;font-weight:650;margin:18px 0 22px;font-variant-numeric:tabular-nums}.badge{display:inline-block;font-size:11px;border-radius:20px;background:var(--wash);padding:3px 9px;text-transform:capitalize}.badge.paid{color:var(--accent)}.badge.overdue{color:var(--danger)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input{flex:1;min-width:130px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}.rows{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr auto;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:15px 0;background:transparent}.row strong{display:block}.row .right{text-align:right}.money{font-variant-numeric:tabular-nums}.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}.dates dt{color:var(--muted);font-size:11px}.dates dd{margin:4px 0 0;overflow-wrap:anywhere}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:18px 0;font-size:13px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left;padding-left:0;min-width:140px;overflow-wrap:anywhere}th{font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}.totals{margin-left:auto;max-width:270px}.totals div{display:flex;justify-content:space-between;gap:24px;padding:6px 0}.total{font-weight:650;border-top:1px solid var(--line);margin-top:8px;padding-top:12px!important}.notes{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:13px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;color:var(--muted);font-size:12px}.metrics{display:flex;gap:24px;flex-wrap:wrap;padding:18px 0;border-bottom:1px solid var(--line)}.metrics strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}.metrics span{font-size:11px;color:var(--muted)}#notice{font-size:13px;color:var(--danger);overflow-wrap:anywhere}#notice:empty{display:none}.empty{padding:32px 0;color:var(--muted)}.activity{font-size:12px;color:var(--muted);padding-left:18px}.activity li{padding:3px 0}.confirm{padding:14px;background:var(--wash);border-radius:8px;margin:16px 0}.confirm p{margin:0 0 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}h2{font-size:13px;margin:24px 0 8px}.brandmark{color:var(--accent)}@media(max-width:440px){main{padding:16px}.dates{grid-template-columns:1fr 1fr}.toolbar{gap:6px}th,td{padding:10px 5px}.row{gap:6px}.top{gap:8px}.footer{flex-wrap:wrap}}
</style></head><body><main><header class="top"><div><span class="brand">nota<span class="brandmark">.</span></span><div class="eyebrow">Invoice workspace</div></div><span class="subtitle" id="organization">Your billing, in conversation</span></header><p role="status" aria-live="polite" id="notice"></p><section id="content" aria-busy="true"><p class="empty">Loading your invoices…</p></section></main><!-- APP_SCRIPT --></body></html>
